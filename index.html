<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Hub</title>

    <link href="./src/css/output.css" rel="stylesheet" />
    <link rel="icon" href="src/img/bookhub-icon-mark.svg" />
    <link rel="apple-touch-icon" href="src/img/bookhub-icon-mark.svg" />
    <link rel="manifest" href="manifest.webmanifest" />

    <script defer type="module" src="src/js/controller.js"></script>
    <script
      defer
      src="https://kit.fontawesome.com/5bde7ee893.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body class="bg-[#102033] grid place-items-center">
    <div
      class="border-y-2 border-x-2 w-29/30 h-19/20 rounded-3xl bg-[#3770b3] border-white/10 flex"
    >
      <header
        class="bg-[#18304d]/90 text-white/80 p-1 justify-between rounded-3xl shadow-1xl w-1/7 h-full"
      >
        <nav class="h-full flex flex-col justify-between pb-1">
          <ul class="grid grid-rows-3 items-center">
            <li class="mb-2">
              <a href="#"
                ><img
                  src="src/img/bookhub-logo-primary.svg"
                  alt="book hub logo"
              /></a>
            </li>
            <li class="m-auto">
              <button
                class="flex justify-center items-center gap-x-2 focus-within:shadow-md duration-200 w-33 h-11 p-3 rounded-2xl cursor-pointer"
              >
                <svg
                  class="w-5 h-5 mt-1"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z"
                  />
                </svg>
                My Books
              </button>
            </li>
            <li class="m-auto">
              <button
                class="flex justify-center items-center gap-x-2 focus-within:shadow-md duration-200 w-33 h-11 p-3 rounded-2xl cursor-pointer"
              >
                <svg
                  class="w-5 h-5 mt-1"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
                  />
                </svg>

                My library
              </button>
            </li>
          </ul>
          <a
            href="#"
            class="flex items-center justify-between mx-1 px-2 py-1.5 focus-within:shadow-md duration-200 rounded-3xl"
          >
            <svg
              class="w-6 h-6"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              />
            </svg>
            <span class="text-center">Account</span>
            <svg
              class="w-4 h-4"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"
              />
            </svg>
          </a>
        </nav>
      </header>

      <main
        class="bg-[#18304d]/90 text-white m-4 max-h-full w-full rounded-3xl inset-shadow-sm inset-shadow-white/10"
      >
        <div
          class="h-1/10 w-full shadow-sm rounded-t-2xl py-2 px-2 grid grid-cols-8"
        >
          <form
            action="search"
            class="mx-5 grid grid-cols-8 h-full rounded-2xl col-span-7"
            id="search"
          >
            <input
              type="search"
              placeholder="Search and find your favorite book"
              class="search_field col-span-7 pl-5 outline-none"
            />
            <button
              type="submit"
              class="bg-blue-950 rounded-2xl text-white/80 flex items-center justify-center gap-x-2 cursor-pointer"
            >
              <svg
                class="w-5 h-5 mt-1"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                strokeWidth="{1.5}"
                stroke="currentColor"
                className="size-6"
              >
                <path
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
                />
              </svg>
              Search
            </button>
          </form>
          <a
            href="#"
            class="flex items-center justify-between mx-2 px-3 py-1 focus-within:shadow-md duration-200 rounded-3xl"
          >
            <svg
              class="w-6 h-6"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              />
            </svg>
            <span class="text-center">Account</span>
          </a>
        </div>
        <div class="h-18/20 w-full grid grid-rows-12 rounded-b-3xl">
          <ul
            class="grid grid-cols-5 gap-3 row-span-11 w-full p-4 max-h-120 overflow-y-auto gap-y-5 scrollbar-thin"
            id="resultsContainer"
          >
            <p class="font-bold text-white/70 text-center m-auto col-span-5">
              Start by searching your favorite books!
            </p>
          </ul>
        </div>
      </main>

      <footer></footer>
    </div>
  </body>
</html>
